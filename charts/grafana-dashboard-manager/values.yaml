---
image:
  repository: ghcr.io/mdalgitsis/grafana-dashboard-manager
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

grafana:
  url: "http://grafana.monitoring.svc.cluster.local:3000"
  # Service account token is read from a pre-existing Secret. There is no
  # default: the chart will not install without one.
  existingSecret: ""
  tokenKey: token

dashboard:
  uid: "slice-ambr"
  title: "Slice AMBR Closed Loop"

backoffLimit: 4
